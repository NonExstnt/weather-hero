<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Hero</title>
    <link rel="stylesheet" href="/stylesheets/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌦️</text></svg>">
</head>
<body>
    <div class="container">
        <header>
            <h1>🌦️ Weather Hero</h1>
            <p>Your local weather companion</p>
        </header>

        <main>
            <section class="weather-card">
                <div class="loading" id="loading">
                    <div class="spinner"></div>
                    <p>Getting your weather...</p>
                </div>

                <div class="weather-display" id="weather-display" style="display: none;">
                    <div class="location">
                        <h2 id="location-name">Loading...</h2>
                        <p id="location-coords"></p>
                    </div>

                    <div class="current-weather">
                        <div class="temperature">
                            <span id="temperature">--</span>°C
                        </div>
                        <div class="weather-info">
                            <img id="weather-icon" src="" alt="Weather icon">
                            <p id="weather-description">Loading...</p>
                        </div>
                    </div>

                    <div class="weather-details">
                        <div class="detail">
                            <span class="label">Feels like</span>
                            <span id="feels-like">--°C</span>
                        </div>
                        <div class="detail">
                            <span class="label">Humidity</span>
                            <span id="humidity">--%</span>
                        </div>
                        <div class="detail">
                            <span class="label">Wind</span>
                            <span id="wind">-- km/h</span>
                        </div>
                        <div class="detail">
                            <span class="label">Pressure</span>
                            <span id="pressure">-- hPa</span>
                        </div>
                    </div>
                </div>

                <div class="error-display" id="error-display" style="display: none;">
                    <h3>❌ Weather Unavailable</h3>
                    <p id="error-message">Unable to fetch weather data.</p>
                    <button onclick="location.reload()" class="retry-btn">Try Again</button>
                </div>
            </section>

            <section class="location-controls">
                <button id="refresh-btn">🔄 Refresh</button>
                <button id="location-btn">📍 Use My Location</button>
            </section>

            <section class="capital-cities">
                <h3>🌍 Capital Cities</h3>
                <div class="cities-grid">
                    <button class="city-btn" data-city="London" data-lat="51.5074" data-lon="-0.1278">
                        🇬🇧 London
                    </button>
                    <button class="city-btn" data-city="Paris" data-lat="48.8566" data-lon="2.3522">
                        🇫🇷 Paris
                    </button>
                    <button class="city-btn" data-city="Tokyo" data-lat="35.6762" data-lon="139.6503">
                        🇯🇵 Tokyo
                    </button>
                    <button class="city-btn" data-city="Washington D.C." data-lat="38.9072" data-lon="-77.0369">
                        🇺🇸 Washington D.C.
                    </button>
                    <button class="city-btn" data-city="Berlin" data-lat="52.5200" data-lon="13.4050">
                        🇩🇪 Berlin
                    </button>
                    <button class="city-btn" data-city="Rome" data-lat="41.9028" data-lon="12.4964">
                        🇮🇹 Rome
                    </button>
                    <button class="city-btn" data-city="Madrid" data-lat="40.4168" data-lon="-3.7038">
                        🇪🇸 Madrid
                    </button>
                    <button class="city-btn" data-city="Moscow" data-lat="55.7558" data-lon="37.6173">
                        🇷🇺 Moscow
                    </button>
                    <button class="city-btn" data-city="Beijing" data-lat="39.9042" data-lon="116.4074">
                        🇨🇳 Beijing
                    </button>
                    <button class="city-btn" data-city="New Delhi" data-lat="28.6139" data-lon="77.2090">
                        🇮🇳 New Delhi
                    </button>
                    <button class="city-btn" data-city="Canberra" data-lat="-35.2809" data-lon="149.1300">
                        🇦🇺 Canberra
                    </button>
                    <button class="city-btn" data-city="Ottawa" data-lat="45.4215" data-lon="-75.6972">
                        🇨🇦 Ottawa
                    </button>
                </div>
            </section>
        </main>

        <footer>
            <p>Weather data provided by <a href="https://openweathermap.org/" target="_blank">OpenWeather</a></p>
        </footer>
    </div>

    <script src="/js/app.js"></script>
</body>
</html>
